seed: 42

data:
  networks: ["scenario_33radial"]   # Networks loaded as separate folders
  scenarios: [57155]                # Number of scenarios loaded from the CSV files
  normalization: "HeteroDataMVANormalizer"  # data normalization to pu on MVA base
  baseMVA: [100.0]                  # MVA base of each network, one per network in the order of networks:
                                    # the base_mva of its network_info.txt (checked before normalisation)
  check_base_mva: true              # stop if a base differs from network_info.txt (false: legacy checkpoints only)
  mask_value: 0.0                   # Initial value for masked parameters
  val_ratio: 0.1                    # ratio of data for validation
  test_ratio: 0.1                   # ratio of data for testing
  workers: 8

model:
  type: GNS_heterogeneous           # was GPSTransformer (not available in new repo)
  attention_head: 8
  dropout: 0.1
  edge_dim: 13                      # Additional edge features BRANCH_BASE_STATUS_E(11) + BRANCH_CONT_E(12)
  hidden_size: 128
  input_bus_dim: 17                 # Additional bus features + BUS_BASE_STATUS_H(15) + BUS_CONT_H(16)
  input_gen_dim: 6                  # Additional generator node-type feature dim
  output_bus_dim: 5
  output_gen_dim: 1
  num_layers: 24
  topology_gating: message_mask     # drop unavailable branches (base off or hit) from message passing;
                                    # set it from the first stage of a sequence, not mid-sequence
  edge_input_transform: asinh       # Phase 1.4: asinh(Y / edge_input_scale) on the admittance columns
  edge_input_scale: 1.0             #   seen by the edge MLP only (physics keeps raw Y). Default: none.
                                    #   A checkpoint must be used with the setting it was trained with.

training:
  batch_size: 64
  epochs: 100
  reset_vld_threshold_on_finetune: true   # finetune: re-initialise w_off from the new network
  test_on_best_checkpoint: true           # test the exported best_model_state_dict.pt, not the last epoch
  losses: ["MaskedMSE", "PBE", "VLDTopologyLoss"]
  loss_weights: [0.05, 0.15, 0.80]
  gradient_clip_val: 1.0           # Phase 1.6: global-norm clipping (VLD default 1.0; null = off)
  max_nonfinite_steps: 20          # Phase 1.6: stop after this many consecutive NaN/Inf steps


  loss_args: # parameters for tuning the loss functions
    - # ---- MaskedMSE (Phase 1.3) -------------------------------------------
      # Vm/Va only: the masked Qg (PV/REF) is decoded from the predicted
      # voltages and the masked gen Pg is the slack generator, both of the
      # order of the network load. VLD default; legacy = [Vm, Va, Qg, gen_Pg].
      channels: [Vm, Va]
    - # ---- PBE (Phase 1.2) -------------------------------------------------
      slack_power: label           # slack P/Q from the label (VLD default); gen_rows = legacy
      merge_switches: true         # balance on electrical nodes (VLD default)
      bus_scope: energised         # energised buses only (VLD default; see vld_phase1_fixes.md, 1.2c)
      normalisation: load          # per-scenario |S_load| scaling; default none
    - # ---- VLDTopologyLoss -------------------------------------------------
      # Status-logit terms, eq. (18). The topology term (BFS reachability) is
      # primary on every bus; the dataset-label anchor acts only on conflict
      # buses (BFS != label), unweighted by class, so with target_anchor_weight
      # < 1 the decision still follows reachability. With correctly generated
      # data there are no conflicts and the anchor is 0.
      topology_weight: 1.0           # lambda_reach
      target_anchor_weight: 0.5      # lambda_anc  (was 0.25)

      # Voltage terms. off: drives V_hat -> 0 on de-energised buses (L2 + lambda_1 L1,
      # the L1 part is a constant pull that closes the last few mV). on: MSE to
      # the target on energised buses, weighted by the (detached) status prob.
      off_vm_weight: 1.0             # lambda_off
      on_vm_weight: 0.5              # lambda_on
      unreachable_l1_weight: 1.0     # lambda_1

      # Class balance. w_off = n_on / n_off, EMA-smoothed across batches. The
      # decision threshold is derived from it (theta = 1 / (1 + w_off)), so it
      # must be stable: momentum 0.99 ~ a 100-batch window. On the 33-bus N-3
      # set roughly 35-40 % of buses are de-energised, so w_off sits near 1.6
      # and the cap never binds; 10 is a safety limit for sparser outage sets,
      # 50 let a single rare bus take ~9 % of the batch gradient.
      unreachable_pos_weight: auto   # or a number; 1.0 disables balancing
      max_pos_weight: 10.0           # was 50.0
      pos_weight_momentum: 0.99      # 0.0 = per-batch estimate (legacy)

      # Reachability. The 33-bus feeder has a single ext_grid and no grid-forming
      # DG, so only the slack bus energises the network.
      reachability_sources: ref      # ref_and_gen only for grid-forming DG
      input_state_threshold: 0.5     # tau for the 0/1 status and contingency flags
      topology_confidence_gamma: 0.0 # gamma of eq. (8); 0 disables (recommended)

      # Removed (now fixed by the formulation, not tunable):
      #   prediction_threshold  -> always 1 / (1 + w_off), reported as
      #                            "VLD Decision Threshold"; apply the same rule
      #                            at inference, do not hard-code 0.5.
      #   conflict_mode / conflict_*_weight -> label always wins on conflicts.
  accelerator: auto
  devices: auto
  strategy: auto

optimizer:
  learning_rate: 0.0001
  beta1: 0.9
  beta2: 0.999
  lr_decay: 0.7
  lr_patience: 10
  # LR schedule monitor. VLD default: "Validation VLD Loss" (min), the VLD objective alone.
  # lr_monitor: Validation VLD Loss
  # lr_monitor_mode: min

callbacks:
  patience: 100                    # keep >= 100 for VLD: balanced accuracy can stay flat for ~85 epochs before it rises
  tol: 0                           # min_delta in the monitor's units: for VLD that is balanced accuracy (e.g. 0.001), not loss
  # Early-stopping monitor. VLD default: "Validation VLD Balanced Accuracy" (max).
  # monitor: Validation VLD Balanced Accuracy
  # monitor_mode: max

task:
  task_name: VoltageLossDetection
  ref_vm_input: true               # Phase 1.5: slack Vm set-point is an input (default false)
  mask_pv_vm: true                 # Phase 1.5: PV Vm is predicted, not copied (default false)

evaluation:                        # VLD metrics + figures of the model's predictions (after test / predict)
  enabled: true                    # --no-evaluate on the command line also switches it off
  n_boot: 1000                     # cluster-bootstrap draws (over scenarios) for 95 % intervals
  seed: 0                          # bootstrap seed only; independent of the training seed
