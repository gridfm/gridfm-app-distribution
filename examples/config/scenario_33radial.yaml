seed: 42

data:
  networks: ["scenario_33radial"]   # Networks loaded as separate folders
  scenarios: [57155]                # Number of scenarios loaded from the CSV files
  normalization: "HeteroDataMVANormalizer"  # data normalization to pu on MVA base
  baseMVA: 100                      # Base MVA for normalization
  mask_value: 0.0                   # Initial value for masked parameters
  val_ratio: 0.1                    # ratio of data for validation
  test_ratio: 0.1                   # ratio of data for testing
  workers: 8

model:
  type: GNS_heterogeneous           # was GPSTransformer (not available in new repo)
  attention_head: 8
  dropout: 0.1
  edge_dim: 13                      # Additional edge features BRANCH_BASE_STATUS_E(11) + BRANCH_CONT_E(12)
  hidden_size: 128
  input_bus_dim: 17                 # Additional bus features + BUS_BASE_STATUS_H(15) + BUS_CONT_H(16)
  input_gen_dim: 6                  # Additional generator node-type feature dim
  output_bus_dim: 5
  output_gen_dim: 1
  num_layers: 24

training:
  batch_size: 64
  epochs: 100
  losses: ["MaskedMSE", "PBE", "VLDTopologyLoss"]
  loss_weights: [0.05, 0.15, 0.80]


  loss_args: # parameters for tuning the loss functions
    - {}                           # MaskedMSE tuning can be activated for fine tuning tasks
    - {}                           # PBE tuning can be activated for fine tuning tasks
    - # ---- VLDTopologyLoss -------------------------------------------------
      # Status-logit terms, eq. (18). Both terms share the stationary point
      # p* = y on agreeing buses; on conflict buses (BFS != label) the topology
      # weight is zero and the anchor weight is w_off, so the label wins. The
      # anchor is the only signal on those buses, hence it is raised from 0.25
      # to 0.5 so they are learned at a comparable rate to agreeing buses.
      topology_weight: 1.0           # lambda_reach
      target_anchor_weight: 0.5      # lambda_anc  (was 0.25)

      # Voltage terms. off: drives V_hat -> 0 on de-energised buses (L2 + lambda_1 L1,
      # the L1 part is a constant pull that closes the last few mV). on: MSE to
      # the target on energised buses, weighted by the (detached) status prob.
      off_vm_weight: 1.0             # lambda_off
      on_vm_weight: 0.5              # lambda_on
      unreachable_l1_weight: 1.0     # lambda_1

      # Class balance. w_off = n_on / n_off, EMA-smoothed across batches. The
      # decision threshold is derived from it (theta = 1 / (1 + w_off)), so it
      # must be stable: momentum 0.99 ~ a 100-batch window. On the 33-bus N-3
      # set roughly 35-40 % of buses are de-energised, so w_off sits near 1.6
      # and the cap never binds; 10 is a safety limit for sparser outage sets,
      # 50 let a single rare bus take ~9 % of the batch gradient.
      unreachable_pos_weight: auto   # or a number; 1.0 disables balancing
      max_pos_weight: 10.0           # was 50.0
      pos_weight_momentum: 0.99      # 0.0 = per-batch estimate (legacy)

      # Reachability. The 33-bus feeder has a single ext_grid and no grid-forming
      # DG, so only the slack bus energises the network.
      reachability_sources: ref      # ref_and_gen only for grid-forming DG
      input_state_threshold: 0.5     # tau for the 0/1 status and contingency flags
      topology_confidence_gamma: 0.0 # gamma of eq. (8); 0 disables (recommended)

      # Removed (now fixed by the formulation, not tunable):
      #   prediction_threshold  -> always 1 / (1 + w_off), reported as
      #                            "VLD Decision Threshold"; apply the same rule
      #                            at inference, do not hard-code 0.5.
      #   conflict_mode / conflict_*_weight -> label always wins on conflicts.
  accelerator: auto
  devices: auto
  strategy: auto

optimizer:
  learning_rate: 0.0001
  beta1: 0.9
  beta2: 0.999
  lr_decay: 0.7
  lr_patience: 10

callbacks:
  patience: 100
  tol: 0

task:
  task_name: VoltageLossDetection

evaluation:                        # VLD metrics + figures of the model's predictions (after test / predict)
  enabled: true                    # --no-evaluate on the command line also switches it off
  n_boot: 1000                     # cluster-bootstrap draws (over scenarios) for 95 % intervals
  seed: 0                          # bootstrap seed only; independent of the training seed