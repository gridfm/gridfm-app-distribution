# std_types    : line / trafo std type names resolved from netlib.std_libraries
# mv           : MV sections, bus counts per voltage level, switches, lines, trafos
# lv           : one LV network template, replicated below every secondary substation
# load_points  : ADMD per customer, power factor, customers per LV bus
# options      : lp_placement, run_diagnostic, run_powerflow, mv_bus_index_start
# ------------------------------------------------------------
