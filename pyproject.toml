[build-system]
requires = ["setuptools >= 83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridfm_app_dist*"]
namespaces = false

[project]
name = "gridfm-app-distribution"
description = "Grid Foundation Model for electricity distribution use cases"
version = "0.0.1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"

authors = [
  {name = "Mikka Kisuule", email = "mikka.kisuule@inesctec.pt"},
]

maintainers = [
  {name = "Mikka Kisuule", email = "mikka.kisuule@inesctec.pt"},
]

keywords = ["electric power grid", "foundational model", "graph neural networks", "electricity distribution"]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]


dependencies = [
    "mlflow>=3.1.0", #or upgrade to "mlflow>=3.15.0",
    "nbformat>=5.10.4",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "opt-einsum>=3.3.0",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
    "pyyaml>=6.0.2",
    "torch>=2.10,<2.13",
    "torch-geometric>=2.6.1",
    "torchaudio>=2.10",
    "torchvision>=0.25",
    "lightning", # or upgrade to "lightning>=2.6.5",
    "seaborn",
    "urllib3>=2.6.0",
    "gdown>=6.0.0",
    "gridfm-datakit==1.1.0",
    "pyarrow>=23.0.1", #Added
	"scikit-learn"
]
[project.optional-dependencies]
dev = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "pre-commit",
  "bandit",
  "build"
]

test = [
  "pytest",
  "pytest-cov"
]

# torch-scatter is not on PyPI — it requires a PyG wheel index matching your torch version.
# The find-links URL below must be updated whenever the torch version in [project.dependencies] changes.
# CPU:  https://data.pyg.org/whl/torch-X.Y.Z+cpu.html
# CUDA: https://data.pyg.org/whl/torch-X.Y.Z+cuNNN.html
# After updating, regenerate the lock file with: uv lock
#find-links = [
#   "https://data.pyg.org/whl/torch-2.12.0+cpu.html",
#    "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
#]

[project.scripts]
gridfm_app_dist = "gridfm_app_dist.__main__:main"
