[build-system]
requires = ["setuptools >= 75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridfm_dist_app*"]
namespaces = false

[project]
name = "gridfm-app-distribution"
description = "Grid Foundation Model for electricity distribution use cases"
version = "0.8.1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"

authors = [
  {name = "Mikka Kisuule", email = "mikka.kisuule@inesctec.pt"},
]

maintainers = [
  {name = "Mikka Kisuule", email = "mikka.kisuule@inesctec.pt"},
]

keywords = ["electric power grid", "foundational model", "graph neural networks", "electricity distribution"]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence8 for Electrical power grids"
]


dependencies = [
    "mlflow>=3.1.0",
    "nbformat>=5.10.4",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "opt-einsum>=3.3.0",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
    "pyyaml>=6.0.2",
    "torch>=2.10", #Install torch scatter separately
    "torch-geometric>=2.6.1",
    "torchaudio>=2.10",
    "torchvision>=0.25",
    "lightning",
    "seaborn",
    "urllib3>=2.6.0",
    "gdown>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "pre-commit",
  "bandit",
  "build"
]

test = [
  "pytest",
  "pytest-cov"
]

[project.scripts]
gridfm_dist_app = "gridfm_dist_app.__main__:main"
